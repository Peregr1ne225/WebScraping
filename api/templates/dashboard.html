{% load static %}
<!DOCTYPE html>
<html lang="th">
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% csrf_token %}
    <meta name="csrf-token" content="{{ csrf_token }}">
    <link href="https://cdn.jsdelivr.net/npm/nouislider@14.6.3/distribute/nouislider.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/6d6cc9793e.js" crossorigin="anonymous"></script>
    {% comment %} <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"> {% endcomment %}
    <link rel="stylesheet" href="{% static 'styles.css' %}">
    <title>Dashboard</title>
</head>
<body>
    {% include "navbar.html" %}
    <div class="scrap-menu container d-flex justify-content-center mb-3">
        <div class=" d-flex align-items-center justify-content-center">
            <p class="d-flex align-self-center">Strat Here</p>
        </div>
    </div>
    <div class="log-diplay container d-flex bg-secondary flex-column align-items-center" style="height: 70vh">
        <div class="fs-4 d-flex align-items-center" style="height: 15%;">
           <p class="fw-bold m-auto">Log Display</p>
        </div>
        <div class="log-panel d-flex flex-grow-1 flex-column-reverse mb-4 px-3">
            <p class="fs-6 border-top border-primary my-auto py-2">Log Panel</p>
            <p class="fs-6 border-top border-primary my-auto py-2">tes1</p>
            <p class="fs-6 border-top border-primary my-auto py-2">tes2</p>
            <p class="fs-6 border-top border-primary my-auto py-2">tes3</p>
        </div>
    </div>
<script>
    let log_data = JSON.parse('{{ data|escapejs|safe }}');
    window.addEventListener('load', function(){
        let log_panel = document.querySelector('.log-panel');
        log_data.forEach((log) => {
            console.log(log);
            let p = document.createElement('p');
            p.textContent = log.NewData;
            log_panel.appendChild(p);
        });
    });
</script>


</body>
