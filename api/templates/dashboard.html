{% load static %}
<!DOCTYPE html>
<html lang="th">
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% csrf_token %}
    <meta name="csrf-token" content="{{ csrf_token }}">
    <link href="https://cdn.jsdelivr.net/npm/nouislider@14.6.3/distribute/nouislider.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/6d6cc9793e.js" crossorigin="anonymous"></script>
    {% comment %} <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"> {% endcomment %}
    <link rel="stylesheet" href="{% static 'styles.css' %}">
    <title>Dashboard</title>
</head>
<body>
    {% include "navbar.html" %}
    <div class="scrap-menu container d-flex justify-content-center mb-3">
        <div class=" d-flex align-items-center justify-content-center">
            <p class="d-flex align-self-center">Strat Here</p>
        </div>
    </div>
    <div class="log-diplay container d-flex bg-secondary flex-column align-items-center" style="height: 70vh">
        <div class="fs-4 d-flex align-items-center" style="height: 15%;">
           <p class="fw-bold m-auto text-primary">Log Display</p>
        </div>
        <div class="log-panel d-flex flex-grow-1 flex-column-reverse mb-4 px-3">

        </div>
    </div>
<script>
    // Create underline text
    function createUnderlineText(text) {
        let node = document.createElement('span');
        node.style.textDecoration = 'underline';
        node.textContent = text;
        return node;
    }
    // Log data
    let log_data = JSON.parse('{{ data|escapejs|safe }}');
    window.addEventListener('load', function(){
        let log_panel = document.querySelector('.log-panel');
        log_data.forEach((log) => {
            let p = document.createElement('p');
            p.className = 'fs-6 border-top border-primary my-auto py-2';
            
            let isoString = log.DateEdit;
            let date = new Date(isoString);
            let year = date.getFullYear();
            let month = (date.getMonth() + 1).toString().padStart(2, '0'); // Months are 0-based in JavaScript
            let day = date.getDate().toString().padStart(2, '0');
            let hours = date.getHours().toString().padStart(2, '0');
            let minutes = date.getMinutes().toString().padStart(2, '0');
            let seconds = date.getSeconds().toString().padStart(2, '0');
            let formattedDate = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
            
            let editDate = document.createElement('strong');
            editDate.textContent = formattedDate;
            p.appendChild(editDate);
            p.appendChild(document.createTextNode(` Edit by: `));
            p.appendChild(createUnderlineText(`${log.EditBy}`));
            p.appendChild(document.createTextNode(` ProductID: `));
            p.appendChild(createUnderlineText(`${log.ProductID}`));
            p.appendChild(document.createTextNode(` Attributes: `));
            p.appendChild(createUnderlineText(`${log.EditAttrib}`));
            p.appendChild(document.createTextNode(` From: `));
            p.appendChild(createUnderlineText(`${log.OldData}`));
            p.appendChild(document.createTextNode(` To: `));
            p.appendChild(createUnderlineText(`${log.NewData}`));

            log_panel.appendChild(p);
        });
    });
</script>


</body>
