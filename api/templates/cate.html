{% extends "base.html" %}
{% block title %} Home {% endblock title %}
{% block brand %}
<div id="dynamicBrand" class="list-group list-group-flush list-of-brand">
    <a href="#item-1" class="list-group-item list-of-brand">
        Item 1 
    </a>
    <a href="#item-2" class="list-group-item list-of-brand">
        Item 2 
    </a>
    <a href="#item-3" class="list-group-item list-of-brand" > Item 3 </a>
</div>
{% endblock brand %}
{% block content %}
    <div class="item-group">
        <div class="item-product d-flex justify-content-between align-items-center" >
            <p>Product ID</p>
            <p>Product Name</p>
        </div>
    </div>
    
{% endblock content %}
{% block script %}
<script>
    //Create GroupItem
    let data = JSON.parse('{{ data|escapejs|safe }}');
    let groupset = new Set();
    for(let i=0; i < data.length; i++){
        groupset.add(data[i].SimilarGroup);     
    }
    //Use Group to find product for each group
    window.addEventListener('load', async function() {
        let brandExist = []
        let currentUrl = new URL(window.location.href);
        currentUrl = currentUrl.origin + currentUrl.pathname;
        let minPrice = 0;
        let maxPrice = 0;
        let brandParent = document.getElementById('dynamicBrand');
        for(let group of groupset){
            var item_display = document.getElementById('product-display');
            var item_group = document.createElement('div');
            item_group.className = 'item-group border border-primary';
            item_group.id = `group-${group}`;
            try{
                let response = await fetch('/api/product/?group='+group);
                let product = await response.json();
                product.results.forEach(function(item){
                    // create brand
                    if(!brandExist.includes(item.BrandID)) {
                        brandExist.push(item.BrandID);
                        createBrand(item.BrandID, item.BrandName, currentUrl, brandParent);
                    }
                    sliderSetPrice(item.Price) // set min and max price
                    itemDiv = addProduct(item) // create product
                    item_group.appendChild(itemDiv); // append product to group
                });
                item_display.appendChild(item_group); // append product to category
            }
            catch(error){
                console.log(error);
            }
        }
    });
    function createBrand(brandID, brandName, currentUrl, brandParent){
        let brandItem = document.createElement('a');
        brandItem.href = currentUrl + "?brand=" + brandID;
        brandItem.className = "list-group-item list-of-brand";
        //onlick brandItem.setAttribute('onclick', 'loadBrand(this.id)');
        brandItem.textContent = brandName;
        brandParent.appendChild(brandItem);
    }
</script>
<script>
    function changeGroup(id, group){
        let existGroup = document.getElementById(`group-${group}`);
        let item_id = document.getElementById(id);
        
        if (existGroup) {
            existGroup.appendChild(item_id);
        }
        else {
            let item_display = document.getElementById('product-display');
            let item_group = document.createElement('div');
            item_group.className = 'item-group border border-primary';
            item_group.id = `group-${group}`;
            item_group.appendChild(item_id);
            item_display.appendChild(item_group);
        }
    }
</script>
{% endblock script %}
