{% extends "base.html" %}
{% block title %} Search {% endblock title%}
{% block content %}
<div class="query-result d-flex align-item-left align-middle fs-5 ">
    <span class="fw-bold align-middle">Search Results of: </span>
    <span class="text-decoration-underline ms-2 align-middle">{{request.GET.search}}</span>
</div>
<div class="result-view mb-3">
    <div class="result-brand fs-5">
    </div>
</div>
{% endblock content %}
{% block script %}
<script>
    window.addEventListener('load', function() {
        let brandview = document.querySelector('.brand-view .resultbrand');
        try {
            let url = new URL(window.location.href);
            if(url.searchParams.get("brand") != null) {
                let brand = url.searchParams.get("brand");
                fetch("/api/brand/?id=" + brand)
                .then(response => response.json())
                .then(data => {
                brandtoSubmenu(data, document.getElementById("dynamicBrand"))
                })
            }else{
                fetch("/api/brand/")
                .then(response => response.json())
                .then(data => {
                brandtoSubmenu(data, document.getElementById("dynamicBrand"))
                })
            }
        } catch (error) {
            console.log(error);
        }
    });
</script>
<script>
    let data = JSON.parse('{{data|escapejs|safe}}');
    window.addEventListener('load', function() {
        let brandExist = [];
        let currentUrl = new URL(window.location.href);
        let minPrice = 0;
        let maxPrice = 0;
        let brandParent = document.getElementById('dynamicBrand');
        let item_display = document.getElementById('product-display');
        for (let item = 0; item < data.length; item++) {
            let brand = data[item].BrandID;
            let price = data[item].price;
            if (!brandExist.includes(brand)) {
                brandExist.push(data[item].BrandID)
                createBrand(data[item].BrandID, data[item].BrandName, brandParent, currentUrl);
            }
            if(minPrice == 0 || minPrice > data[item].Price || maxPrice == 0 || maxPrice < data[item].Price) {
                if(minPrice == 0 || minPrice > data[item].Price) minPrice = data[item].Price;
                if(maxPrice == 0 || maxPrice < data[item].Price) maxPrice = data[item].Price;
            
                minPrice = parseFloat(minPrice);
                maxPrice = parseFloat(maxPrice);
                if (minPrice == maxPrice) {
                    // If they are, adjust maxPrice slightly
                    maxPrice += 0.01;
                }
                slider.noUiSlider.updateOptions({
                    start: [minPrice, maxPrice],
                    range: {
                        'min': minPrice,
                        'max': maxPrice
                    }
                });
            }
            itemDiv = addProduct(data[item], item_display)
            //item_display.appendChild(itemDiv);
        }
    });
    function createBrand(brandID, brandName, brandParent, currentUrl){
        let params = new URLSearchParams(currentUrl.search);
        let path = currentUrl.origin + currentUrl.pathname;
        let firstKey = Array.from(params.keys())[0];
        let firstValue = params.get(firstKey);
        let brandItem = document.createElement('a');
        let resultBrand = document.querySelector('.result-brand');
        brandItem.href = `${path}?${firstKey}=${firstValue}&brand=${brandID}`;
        brandItem.className = "list-group-item list-of-brand";
        
        if (params.has('brand') && params.get('brand') == brandID) {
            brandItem.classList.add('fw-bold');
            resultBrand.innerHTML = `
                <span class="fw-bold">Brand:</span>
                <span class="resultbrand">${brandName}</span>
            `;
        }
        if (brandName === "") {
            brandName = "No Brand";
        }
        brandItem.textContent = brandName;
        brandParent.appendChild(brandItem);
    }
    
</script>
{% endblock script %}
