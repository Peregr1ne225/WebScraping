{% extends "base.html" %}
{%block title%}Home{%endblock title%}
{% block content %}

{% endblock content %}
{% block script %}
<script>
    window.addEventListener('load', function() {
        try {
            let url = new URL(window.location.href);
            if(url.searchParams.get("brand") != null) {
                let brand = url.searchParams.get("brand");
                fetch("/api/brand/?id=" + brand)
                .then(response => response.json())
                .then(data => {
                brandtoSubmenu(data, document.getElementById("dynamicBrand"))
                })
            }else{
                fetch("/api/brand/")
                .then(response => response.json())
                .then(data => {
                brandtoSubmenu(data, document.getElementById("dynamicBrand"))
                })
            }
        } catch (error) {
            console.log(error);
        }
    });
    function brandtoSubmenu(brand, parentElement){
        let currentUrl = new URL(window.location.href);
        let currentBrandId = currentUrl.searchParams.get('brand');
        let baseUrl = currentUrl.origin;
    
        for(let i=0;i<brand.length;i++) {
            let brandLink = document.createElement("a");
            brandLink.href = baseUrl + "?brand=" + brand[i].BrandID;
            brandLink.className = "list-group-item list-of-brand";
    
            // If the brand ID in the URL matches the current brand ID, make the link bold and focus on it
            if (currentBrandId === brand[i].BrandID.toString()) {
                brandLink.className += " font-weight-bold";
                brandLink.focus();
            }
    
            if (brand[i].BrandName === ""){
                brand[i].BrandName = "Unknown";
            }
            brandLink.textContent = brand[i].BrandName;
            parentElement.appendChild(brandLink)
        }
    }
</script>
<script>
    let data = JSON.parse('{{ data|escapejs|safe }}');
    let groupset = new Set();
    for(let i=0; i < data.length; i++){
        groupset.add(data[i].SimilarGroup);     
    }
    window.addEventListener('load', async function() {
        let minPrice = 0;
        let maxPrice = 0;
        for(let group of groupset){
            let item_display = document.getElementById('product-display');
            let item_group = document.createElement('div');
            item_group.className = 'item-group border border-primary my-2';
            item_group.id = `group-${group}`;
            item_group.className = 'tab item-group border border-primary my-2';
            item_group.id = `group-${group}`;
            let ul = document.createElement('ul');
            ul.className = 'nav nav-tabs';
            ul.id = `group-tab-${group}`;
            ul.setAttribute('role', 'tablist');
            item_group.appendChild(ul);
            let content = document.createElement('div');
            content.className = 'tab-content';
            content.id = `group-content-${group}`;
            try{
                let response = await fetch('/api/product/?group='+group);
                let product = await response.json();
                product.results.forEach(function(item){
                    sliderSetPrice(item.Price) // set min and max price
                    
                    addUl = addTab(item, ul, group) // create tab
                    itemDiv = addProduct(item, content) // create product
                    item_content = addNavClass(itemDiv);
                });
                item_group.appendChild(addUl);
                item_group.appendChild(content);
                item_display.appendChild(item_group);
            } catch(error){
                console.log(error);
            }
        }
    });
</script>
{% endblock script %}
